name: nanobot

x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NANOBOT_CHANNELS: ${NANOBOT_CHANNELS:-whatsapp}
      NANOBOT_BUILD_REF: ${NANOBOT_BUILD_REF:-unknown}
      NANOBOT_BUILD_TIME: ${NANOBOT_BUILD_TIME:-unknown}
  # The local WSL user and the image's nanobot user are both UID/GID 1000.
  # Starting non-root also keeps cap_drop: ALL compatible with entrypoint.sh.
  user: "1000:1000"
  volumes:
    - ./runtime:/home/nanobot/.nanobot
  environment:
    # Git-over-SSH and GitHub's API are separate authentication paths. Set a
    # fine-grained PAT in an ignored .env file to activate GitHub MCP tools.
    GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
    # QQ Bot credentials are kept in the ignored local .env file and resolved
    # by runtime/config.json through environment-variable placeholders.
    QQ_APP_ID: ${QQ_APP_ID:-}
    QQ_APP_SECRET: ${QQ_APP_SECRET:-}
    # Xindu model gateway credential for the active glm-5.3-flash runtime model.
    XINDU_API_KEY: ${XINDU_API_KEY:-}
    # Containers do not inherit the host's proxy environment. Forward the
    # standard variables so configured remote providers use the same route.
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    ALL_PROXY: ${ALL_PROXY:-}
    NO_PROXY: ${NO_PROXY:-}
  cap_drop:
    - ALL

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    container_name: nanobot-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobot/.nanobot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
